name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js 가 node >=22 를 요구한다. 20 에서는 EBADENGINE 경고가
          # 뜨고, 함께 딸려오는 npm 10 은 wasm32-wasi 폴백 패키지(@emnapi/*)의 optional
          # 항목을 npm 11 과 다르게 해석해 npm ci 가 "lock file 과 불일치" 로 죽는다.
          # 로컬 개발 환경(node 24)과 같은 메이저로 맞춘다.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
