name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js 가 node >=22 를 요구한다. 20 에서는 EBADENGINE 경고가
          # 계속 났다. 로컬 개발 환경(node 24)과 같은 메이저로 맞춘다.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
